name: CI

on:
  push:
  pull_request:

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  backend-postgres:
    # Row-level security only exists on Postgres, so the suite also runs there.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pallet
          POSTGRES_PASSWORD: pallet
          POSTGRES_DB: pallet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pallet" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pallet:pallet@localhost:5432/pallet_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
